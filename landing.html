<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>幼儿健康小卫士 - 欢迎</title>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji";
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0f7fa 0%, #b2ebf2 50%, #80deea 100%);
            min-height: 100vh;
            color: #2c3e50;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            position: relative;
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            padding-top: 80px;
        }

        .logo {
            font-size: 64px;
            color: #4ecdc4;
            margin-bottom: 30px;
        }

        .title {
            font-size: 48px;
            margin: 0;
            color: #2c3e50;
            font-weight: bold;
        }

        .subtitle {
            font-size: 24px;
            color: #666;
            margin: 20px 0 30px;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            margin: 0 0 40px 0;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .features.show {
            opacity: 1;
            transform: translateY(0);
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .feature-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(78, 205, 196, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .feature-card:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .feature-card:hover::before {
            opacity: 1;
        }

        .feature-icon {
            font-size: 40px;
            color: #4ecdc4;
            margin-bottom: 20px;
        }

        .feature-title {
            font-size: 24px;
            margin: 0 0 15px;
            color: #2c3e50;
        }

        .feature-description {
            color: #666;
            line-height: 1.6;
        }

        .cta-section {
            text-align: center;
            padding: 0;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
            position: relative;
            width: 100%;
            margin-top: 20px;
        }

        .cta-section.show {
            opacity: 1;
            transform: translateY(0);
        }

        .cta-button {
            background: linear-gradient(45deg, #4ecdc4, #45b7af);
            color: white;
            padding: 20px 60px;
            border: none;
            border-radius: 30px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .cta-button::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s ease, height 0.6s ease;
        }

        .cta-button:hover::after {
            width: 300px;
            height: 300px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }

        .highlight {
            color: #4ecdc4;
            font-weight: bold;
        }

        .safety-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            margin: 40px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .safety-section.show {
            opacity: 1;
            transform: translateY(0);
        }

        .safety-title {
            font-size: 28px;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .safety-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .safety-item {
            text-align: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .safety-item::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, #4ecdc4, #45b7af);
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }

        .safety-item:hover::after {
            transform: scaleX(1);
        }

        .safety-icon {
            font-size: 36px;
            color: #4ecdc4;
            margin-bottom: 15px;
        }

        .safety-label {
            font-size: 18px;
            color: #2c3e50;
            margin: 10px 0;
        }

        .safety-value {
            font-size: 24px;
            color: #4ecdc4;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }

            .header {
                min-height: 85vh;
                padding-top: 40px;
            }

            .title {
                font-size: 36px;
            }

            .subtitle {
                font-size: 18px;
                margin: 15px 0 20px;
            }

            .cta-button {
                padding: 15px 40px;
                font-size: 20px;
            }

            .feature-card {
                padding: 20px;
            }

            .safety-section {
                padding: 20px;
            }
        }

        /* 添加滚动动画相关样式 */
        .scroll-animate {
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s ease;
        }

        .scroll-animate.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* 添加滚动提示动画 */
        .scroll-hint {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #4ecdc4;
            font-size: 24px;
            animation: bounce 2s infinite;
            cursor: pointer;
            margin-top: auto;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-20px);
            }
            60% {
                transform: translateY(-10px);
            }
        }

        /* 添加背景动画效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(78, 205, 196, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 50%, rgba(78, 205, 196, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 50% 80%, rgba(78, 205, 196, 0.1) 0%, transparent 20%);
            pointer-events: none;
            z-index: 0;
            animation: backgroundShift 20s ease-in-out infinite;
        }

        @keyframes backgroundShift {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 添加页面加载动画 */
        .page-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }

        .loader-content {
            text-align: center;
        }

        .loader-icon {
            font-size: 48px;
            color: #4ecdc4;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 添加滚动进度条 */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #4ecdc4, #45b7af);
            z-index: 1000;
            transition: width 0.1s ease;
        }
    </style>
</head>
<body>
    <!-- 添加页面加载动画 -->
    <div class="page-loader">
        <div class="loader-content">
            <i class="ri-shield-check-line loader-icon"></i>
            <p>加载中...</p>
        </div>
    </div>

    <!-- 添加滚动进度条 -->
    <div class="scroll-progress"></div>

    <div class="container">
        <div class="header">
            <div class="logo">
                <i class="ri-shield-check-line"></i>
            </div>
            <h1 class="title">幼儿健康小卫士</h1>
            <p class="subtitle">智能家居环境监测机器人，守护孩子的健康成长</p>
            <div class="cta-section">
                <button class="cta-button" onclick="window.location.href='login.html'">立即开始使用</button>
            </div>
            <div class="scroll-hint">
                <i class="ri-arrow-down-line"></i>
            </div>
        </div>

        <div class="features">
            <div class="feature-card">
                <div class="feature-icon">
                    <i class="ri-temp-hot-line"></i>
                </div>
                <h3 class="feature-title">实时监测</h3>
                <p class="feature-description">24小时不间断监测室内温度、湿度、甲醛和PM2.5等环境指标，确保室内环境始终处于健康状态。</p>
            </div>

            <div class="feature-card">
                <div class="feature-icon">
                    <i class="ri-alarm-warning-line"></i>
                </div>
                <h3 class="feature-title">智能预警</h3>
                <p class="feature-description">当环境指标超出安全范围时，系统会立即发出预警，并提供专业的改善建议。</p>
            </div>

            <div class="feature-card">
                <div class="feature-icon">
                    <i class="ri-line-chart-line"></i>
                </div>
                <h3 class="feature-title">数据分析</h3>
                <p class="feature-description">提供详细的数据分析和趋势图表，帮助您了解室内环境的变化规律。</p>
            </div>
        </div>

        <div class="safety-section">
            <h2 class="safety-title">安全标准参考</h2>
            <div class="safety-grid">
                <div class="safety-item">
                    <div class="safety-icon">
                        <i class="ri-temp-hot-line"></i>
                    </div>
                    <div class="safety-label">适宜温度</div>
                    <div class="safety-value">18-28°C</div>
                </div>
                <div class="safety-item">
                    <div class="safety-icon">
                        <i class="ri-water-percent-line"></i>
                    </div>
                    <div class="safety-label">适宜湿度</div>
                    <div class="safety-value">30-70%</div>
                </div>
                <div class="safety-item">
                    <div class="safety-icon">
                        <i class="ri-wind-line"></i>
                    </div>
                    <div class="safety-label">甲醛标准</div>
                    <div class="safety-value">≤0.08mg/m³</div>
                </div>
                <div class="safety-item">
                    <div class="safety-icon">
                        <i class="ri-cloudy-line"></i>
                    </div>
                    <div class="safety-label">PM2.5标准</div>
                    <div class="safety-value">≤75μg/m³</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>© 2024 幼儿健康小卫士 - 为孩子的健康成长保驾护航</p>
        </div>
    </div>

    <script>
        // 页面加载动画
        window.addEventListener('load', () => {
            const loader = document.querySelector('.page-loader');
            loader.style.opacity = '0';
            setTimeout(() => {
                loader.style.display = 'none';
            }, 500);
        });

        // 滚动进度条
        window.addEventListener('scroll', () => {
            const scrollProgress = document.querySelector('.scroll-progress');
            const scrollPercent = (window.scrollY / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
            scrollProgress.style.width = scrollPercent + '%';
        });

        // 平滑滚动
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // 优化滚动动画
        function handleScroll() {
            const elements = document.querySelectorAll('.features, .safety-section, .cta-section');
            
            elements.forEach(element => {
                const elementTop = element.getBoundingClientRect().top;
                const elementVisible = 150;
                
                if (elementTop < window.innerHeight - elementVisible) {
                    element.classList.add('show');
                }
            });
        }

        // 使用节流优化滚动事件
        let isScrolling;
        window.addEventListener('scroll', () => {
            window.clearTimeout(isScrolling);
            isScrolling = setTimeout(() => {
                handleScroll();
            }, 50);
        });

        // 初始检查
        handleScroll();

        // 滚动提示点击事件
        document.querySelector('.scroll-hint').addEventListener('click', () => {
            window.scrollTo({
                top: window.innerHeight,
                behavior: 'smooth'
            });
        });
    </script>
</body>
</html>
